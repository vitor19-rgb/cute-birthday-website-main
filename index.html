  <script src="js/script.js"></script>
  
  <!-- SCRIPT PARA O CRONÔMETRO FUNCIONAR EM TEMPO REAL -->
  <script>
    function updateTimer() {
        // Data em que se conheceram (11 de Março de 2026)
        const startDate = new Date("2026-03-11T00:00:00");
        const now = new Date();
        const diff = now - startDate;

        // Cálculos matemáticos
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        // Exibindo o texto na tela
        document.getElementById("timer").innerHTML =
            days + " dias, " + hours + " horas, " + minutes + " min e " + seconds + " seg ❤️";
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
